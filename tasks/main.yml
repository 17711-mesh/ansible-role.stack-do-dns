---
- name: Ensure base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0755"
  loop:
    - "{{ mesh_17711_stack_do__dns_unbound_config_dir }}"
    - "{{ mesh_17711_stack_do__dns_adguard_work_dir }}"
    - "{{ mesh_17711_stack_do__dns_adguard_conf_dir }}"

- name: Ensure quadlet directory exists for ops user
  ansible.builtin.file:
    path: "{{ mesh_17711_stack_do__dns_stack_quadlet_dir }}"
    state: directory
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0755"

- name: Deploy Unbound hardening configuration
  ansible.builtin.template:
    src: "unbound-01-server-hardening.conf.j2"
    dest: "{{ mesh_17711_stack_do__dns_unbound_config_dir }}/01-server-hardening.conf"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0644"
  when: mesh_17711_stack_do__dns_stack_enable_unbound

- name: Deploy Unbound local mesh configuration
  ansible.builtin.template:
    src: "unbound-10-local-mesh.conf.j2"
    dest: "{{ mesh_17711_stack_do__dns_unbound_config_dir }}/10-local-mesh.conf"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0644"
  when: mesh_17711_stack_do__dns_stack_enable_unbound

- name: Deploy Unbound forwarders configuration (optional)
  ansible.builtin.template:
    src: "unbound-20-forward-upstream.conf.j2"
    dest: "{{ mesh_17711_stack_do__dns_unbound_config_dir }}/20-forward-upstream.conf"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0644"
  when:
    - mesh_17711_stack_do__dns_stack_enable_unbound
    - mesh_17711_stack_do__dns_use_forwarders | bool

- name: Remove Unbound forwarders configuration when disabled
  ansible.builtin.file:
    path: "{{ mesh_17711_stack_do__dns_unbound_config_dir }}/20-forward-upstream.conf"
    state: absent
  when:
    - mesh_17711_stack_do__dns_stack_enable_unbound
    - not mesh_17711_stack_do__dns_use_forwarders | bool


- name: Deploy quadlet kube file for the stack
  ansible.builtin.template:
    src: "stack-do-dns.kube.j2"
    dest: "{{ mesh_17711_stack_do__dns_stack_quadlet_dir }}/{{ mesh_17711_stack_do__dns_stack_quadlet_unit_name }}.kube"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0644"
  when: mesh_17711_stack_do__dns_stack_quadlet_enable | bool

- name: Reload user systemd daemon for DNS stack
  become: true
  become_user: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
  ansible.builtin.command: systemctl --user daemon-reload
  when: mesh_17711_stack_do__dns_stack_quadlet_enable | bool

- name: Ensure DNS stack is running
  become: true
  become_user: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
  ansible.builtin.systemd:
    name: "{{ mesh_17711_stack_do__dns_stack_quadlet_unit_name }}"
    scope: user
    enabled: true
    state: started
  when: mesh_17711_stack_do__dns_stack_quadlet_enable | bool
