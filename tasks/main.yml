---
- name: Ensure base directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0755"
  loop:
    - "{{ mesh_17711_stack_do__dns_unbound_config_dir }}"
    - "{{ mesh_17711_stack_do__dns_adguard_work_dir }}"
    - "{{ mesh_17711_stack_do__dns_adguard_conf_dir }}"

- name: Ensure quadlet directory exists for ops user
  ansible.builtin.file:
    path: "{{ mesh_17711_stack_do__dns_stack_quadlet_dir }}"
    state: directory
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0755"

- name: Deploy Unbound hardening configuration
  ansible.builtin.template:
    src: "unbound-01-server-hardening.conf.j2"
    dest: "{{ mesh_17711_stack_do__dns_unbound_config_dir }}/01-server-hardening.conf"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0644"
  when: mesh_17711_stack_do__dns_stack_enable_unbound

- name: Deploy Unbound local mesh configuration
  ansible.builtin.template:
    src: "unbound-10-local-mesh.conf.j2"
    dest: "{{ mesh_17711_stack_do__dns_unbound_config_dir }}/10-local-mesh.conf"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0644"
  when: mesh_17711_stack_do__dns_stack_enable_unbound

- name: Deploy Unbound forwarders configuration (optional)
  ansible.builtin.template:
    src: "unbound-20-forward-upstream.conf.j2"
    dest: "{{ mesh_17711_stack_do__dns_unbound_config_dir }}/20-forward-upstream.conf"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0644"
  when:
    - mesh_17711_stack_do__dns_stack_enable_unbound
    - mesh_17711_stack_do__dns_use_forwarders | bool

- name: Remove Unbound forwarders configuration when disabled
  ansible.builtin.file:
    path: "{{ mesh_17711_stack_do__dns_unbound_config_dir }}/20-forward-upstream.conf"
    state: absent
  when:
    - mesh_17711_stack_do__dns_stack_enable_unbound
    - not mesh_17711_stack_do__dns_use_forwarders | bool

- name: Generate DNS stack compose file
  ansible.builtin.template:
    src: "dns-stack.compose.yml.j2"
    dest: "/tmp/dns-stack.compose.yml"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_group }}"
    mode: "0644"
  when:
    - mesh_17711_stack_do__dns_stack_enable_unbound or mesh_17711_stack_do__dns_stack_enable_adguard

- name: Debug dns-stack.compose.yml
  ansible.builtin.shell: cat /tmp/dns-stack.compose.yml
  register: dns_stack_compose
  changed_when: false

- debug:
    var: dns_stack_compose.stdout

- name: Include compose-to-quadlet role to deploy DNS stack
  ansible.builtin.include_role:
    name: mesh_17711.compose_to_quadlet
  vars:
    compose_file_path: "/tmp/dns-stack.compose.yml"
    quadlet_output_dir: "{{ mesh_17711_stack_do__dns_stack_quadlet_dir }}"
    quadlet_stack_name: "{{ mesh_17711_stack_do__dns_stack_quadlet_unit_name }}"
    compose_to_quadlet_src_path: "/opt/python.compose-to-quadlet" # Assuming this path is consistent
  when:
    - mesh_17711_stack_do__dns_stack_quadlet_enable | bool
    - mesh_17711_stack_do__dns_stack_enable_unbound or mesh_17711_stack_do__dns_stack_enable_adguard

- name: Ensure Quadlet units are owned by ops user
  ansible.builtin.file:
    path: "{{ mesh_17711_stack_do__dns_stack_quadlet_dir }}/{{ item }}"
    owner: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    group: "{{ mesh_17711_stack_do__dns_stack_ops_user }}"
    mode: "0644"
  loop:
    - "unbound.container"
    - "adguard.container"
    - "default.network"
  when:
    - mesh_17711_stack_do__dns_stack_quadlet_enable | bool

- name: Stop and disable stack target on undeploy
  become: true
  become_user: "{{ mesh_17711_stack__user }}"
  ansible.builtin.systemd:
    name: "{{ mesh_17711_stack__unit_name }}.target"
    scope: user
    state: stopped
    enabled: false
    daemon_reload: true
  when: not mesh_17711_stack__ensure_present
  tags: [mesh_17711_stack, mesh_17711_stack_systemd, mesh_17711_stack_undeploy]
